
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown Timer</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Countdown Timer</h1>

        <p class="subtitle">
            Time is ticking! Make every second count.
        </p>

        <div class="countdown">

            <div class="time-box">
                <h2 id="days">00</h2>
                <span>Days</span>
            </div>

            <div class="time-box">
                <h2 id="hours">00</h2>
                <span>Hours</span>
            </div>

            <div class="time-box">
                <h2 id="minutes">00</h2>
                <span>Minutes</span>
            </div>

            <div class="time-box">
                <h2 id="seconds">00</h2>
                <span>Seconds</span>
            </div>

        </div>

        <p id="message">Countdown is running...</p>

    </div>

    <script src="script.js"></script>

</body>

</html>
